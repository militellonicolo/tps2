<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard COVID-19</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="contenitore">
        <h2>Andamento Nazionale COVID-19</h2>
        <p id="testo-sottotitolo">Visualizzazione ultimi dati</p>
    
        <div class="controlli">
            <label for="input-giorni">Giorni da mostrare:</label>
            <input type="number" id="input-giorni" value="10" min="1">
            <button id="btn-aggiorna">Aggiorna</button>
        </div>
        
        <div class="tabella-wrapper">
            <table id="tabella-covid"></table>
        </div>
    </div>
</body>
</html>
